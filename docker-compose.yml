services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_coo}
      POSTGRES_USER: ${POSTGRES_USER:-ai_coo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_coo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
      - minio
    command: celery -A app.jobs.celery_app.celery_app worker --loglevel=INFO

  beat:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - postgres
      - redis
    command: celery -A app.jobs.celery_app.celery_app beat --loglevel=INFO

  frontend:
    build:
      context: ./frontend
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
