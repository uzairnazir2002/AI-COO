[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coo-backend"
version = "0.1.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "argon2-cffi>=23.1",
  "python-jose[cryptography]>=3.3",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
  "email-validator>=2.2",
  "reportlab>=4.2",
  "httpx>=0.27",
  "structlog>=24.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "integration: live DB-backed integration tests",
]
