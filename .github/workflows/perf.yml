name: Perf Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/perf.yml"

jobs:
  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: grafana/setup-k6-action@v1

      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=perf-local-secret-key-change-me/" .env

      - name: Start stack
        run: docker compose --env-file .env up --build -d postgres redis minio backend

      - name: Wait for health
        run: |
          for i in {1..50}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          docker compose logs backend --tail 200
          exit 1

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx ./backend

      - name: Bootstrap perf org/user
        id: bootstrap
        run: |
          python scripts/loadtest/bootstrap_perf.py > perf_bootstrap.json
          cat perf_bootstrap.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          data = json.load(open("perf_bootstrap.json", encoding="utf-8"))
          print(f"ORG_ID={data['org_id']}")
          print(f"ORG_IDS_JSON={json.dumps([data['org_id']])}")
          print(f"USER_ID={data['user_id']}")
          print(f"ACCESS_TOKEN={data['access_token']}")
          print(f"FROM_DATE={data['month_start']}")
          print(f"TO_DATE={data['today']}")
          PY

      - name: Seed load dataset (small CI profile)
        run: |
          DATABASE_URL=postgresql+asyncpg://ai_coo:ai_coo@localhost:5432/ai_coo \
          python scripts/seed_load_dataset.py --org-id "$ORG_ID" --created-by "$USER_ID" --months 12 --rows 5000

      - name: Run k6 perf smoke
        run: |
          k6 run scripts/loadtest/k6-smoke.js \
            -e BASE_URL=http://localhost:8000/api/v1 \
            -e ACCESS_TOKEN="$ACCESS_TOKEN" \
            -e ORG_ID="$ORG_ID" \
            -e FROM_DATE="$FROM_DATE" \
            -e TO_DATE="$TO_DATE"

      - name: Run read hotpaths (pass 1)
        run: |
          mkdir -p perf-artifacts
          k6 run --no-thresholds --summary-export perf-artifacts/read_hotpaths_pass1_summary.json \
            scripts/loadtest/k6-read-hotpaths.js \
            -e BASE_URL=http://localhost:8000/api/v1 \
            -e ACCESS_TOKEN="$ACCESS_TOKEN" \
            -e ORG_IDS_JSON="$ORG_IDS_JSON" \
            -e FROM_DATE="$FROM_DATE" \
            -e TO_DATE="$TO_DATE" \
            -e RATE=13 \
            -e RUNTIME_METRICS_ENABLED=false

      - name: Run read hotpaths (pass 2)
        run: |
          k6 run --no-thresholds --summary-export perf-artifacts/read_hotpaths_pass2_summary.json \
            scripts/loadtest/k6-read-hotpaths.js \
            -e BASE_URL=http://localhost:8000/api/v1 \
            -e ACCESS_TOKEN="$ACCESS_TOKEN" \
            -e ORG_IDS_JSON="$ORG_IDS_JSON" \
            -e FROM_DATE="$FROM_DATE" \
            -e TO_DATE="$TO_DATE" \
            -e RATE=13 \
            -e RUNTIME_METRICS_ENABLED=false

      - name: Run runtime observability (out-of-band)
        run: |
          k6 run --no-thresholds --summary-export perf-artifacts/runtime_observability_summary.json \
            scripts/loadtest/k6-runtime-observability.js \
            -e BASE_URL=http://localhost:8000/api/v1 \
            -e ACCESS_TOKEN="$ACCESS_TOKEN" \
            -e ORG_IDS_JSON="$ORG_IDS_JSON" \
            -e RATE=2

      - name: Evaluate perf gates
        run: |
          python scripts/loadtest/evaluate_perf_gates.py \
            --slo scripts/loadtest/slo_guardrails.json \
            --read-pass-1 perf-artifacts/read_hotpaths_pass1_summary.json \
            --read-pass-2 perf-artifacts/read_hotpaths_pass2_summary.json \
            --runtime-observability perf-artifacts/runtime_observability_summary.json \
            --out-json perf-artifacts/perf_gate_summary.json \
            --out-md perf-artifacts/perf_gate_summary.md

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: perf-artifacts/

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v
