name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run live integration test profile"
        required: false
        default: "false"
      run_cookie_lane:
        description: "Run Playwright cookie-mode CSRF lane"
        required: false
        default: "false"
      run_sse_lane:
        description: "Run Playwright SSE fallback lane"
        required: false
        default: "false"
      run_visual_lane:
        description: "Run Playwright visual regression lane"
        required: false
        default: "false"
      run_plaid_lane:
        description: "Run Plaid Epic A lane"
        required: false
        default: "false"
      run_ai_live_lane:
        description: "Run AI live-mode verification lane"
        required: false
        default: "false"

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_coo
          POSTGRES_USER: ai_coo
          POSTGRES_PASSWORD: ai_coo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_coo -d ai_coo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-migration-secret
      DATABASE_URL: postgresql+asyncpg://ai_coo:ai_coo@localhost:5432/ai_coo
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import time
          import psycopg2

          last_error = None
          for _ in range(40):
              try:
                  conn = psycopg2.connect(
                      dbname="ai_coo",
                      user="ai_coo",
                      password="ai_coo",
                      host="localhost",
                      port=5432,
                  )
                  conn.close()
                  print("postgres ready")
                  raise SystemExit(0)
              except Exception as exc:  # pragma: no cover - CI-only path
                  last_error = exc
                  time.sleep(2)
          print(f"postgres not ready after retries: {last_error}")
          raise SystemExit(1)
          PY
      - name: Migration safety gate (upgrade/downgrade/re-upgrade)
        run: |
          python scripts/migration_safety_check.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-backend-secret
      DATABASE_URL: postgresql+asyncpg://ai_coo:ai_coo@localhost:5432/ai_coo
      REDIS_URL: redis://localhost:6379/0
      ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run backend tests
        run: pytest app/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint + build
        run: npm run check

  playwright-cookie-csrf:
    if: ${{ vars.CI_E2E_COOKIE_LANE == '1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_cookie_lane == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare cookie lane env
        run: |
          cp .env.example .env
          {
            echo "AUTH_COOKIE_MODE=true"
            echo "COOKIE_SECURE=false"
          } >> .env
      - name: Start stack
        run: docker compose --env-file .env up --build -d
      - name: Wait for health
        run: |
          for i in {1..50}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Install frontend deps + Playwright browser
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run cookie CSRF spec
        run: |
          cd frontend
          E2E_BASE_URL=http://localhost:3000 \
          E2E_API_URL=http://localhost:8000/api/v1 \
          E2E_AUTH_MODE=cookie \
          npx playwright test e2e/cookie-csrf.spec.ts
      - name: Upload cookie lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cookie-csrf-report
          path: frontend/playwright-report
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v

  playwright-sse-fallback:
    if: ${{ vars.CI_E2E_SSE_LANE == '1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_sse_lane == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare SSE lane env
        run: cp .env.example .env
      - name: Start stack
        run: docker compose --env-file .env up --build -d
      - name: Wait for health
        run: |
          for i in {1..50}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Install frontend deps + Playwright browser
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run SSE fallback spec
        run: |
          cd frontend
          E2E_BASE_URL=http://localhost:3000 \
          E2E_API_URL=http://localhost:8000/api/v1 \
          E2E_AUTH_MODE=bearer \
          E2E_SSE=1 \
          npx playwright test e2e/sse-fallback.spec.ts
      - name: Upload SSE lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-sse-fallback-report
          path: frontend/playwright-report
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v

  playwright-visual:
    if: ${{ vars.CI_E2E_VISUAL_LANE == '1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_visual_lane == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare visual lane env
        run: cp .env.example .env
      - name: Start stack
        run: docker compose --env-file .env up --build -d
      - name: Wait for health
        run: |
          for i in {1..50}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Install frontend deps + Playwright browser
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run visual regression spec
        run: |
          cd frontend
          E2E_BASE_URL=http://localhost:3000 \
          E2E_API_URL=http://localhost:8000/api/v1 \
          E2E_AUTH_MODE=bearer \
          E2E_VISUAL=1 \
          npx playwright test e2e/visual.spec.ts
      - name: Upload visual lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: frontend/playwright-report
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run secret hygiene audit
        run: |
          python scripts/ops/secret_hygiene_audit.py \
            --root . \
            --env-file .env.example \
            --out-json secret-hygiene-report.json \
            --out-md secret-hygiene-report.md
      - name: Upload secret hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-hygiene-report
          path: |
            secret-hygiene-report.json
            secret-hygiene-report.md

  integration:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare integration env
        run: cp .env.example .env
      - name: Start stack
        run: docker compose --env-file .env up --build -d
      - name: Wait for health
        run: |
          for i in {1..40}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run smoke suite
        run: python -m pip install httpx && python scripts/smoke_mvp.py --base-url http://localhost:8000/api/v1
      - name: Run live integration test
        run: |
          python -m pip install ./backend[dev]
          cd backend
          RUN_INTEGRATION_LIVE=1 INTEGRATION_BASE_URL=http://localhost:8000/api/v1 pytest app/tests/test_api_integration_live.py -q
      - name: Install frontend deps for E2E
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E (bearer mode)
        run: |
          cd frontend
          E2E_BASE_URL=http://localhost:3000 E2E_API_URL=http://localhost:8000/api/v1 E2E_AUTH_MODE=bearer npm run e2e
      - name: Restart stack in cookie auth mode
        run: |
          docker compose --env-file .env down -v
          sed -i 's/^AUTH_COOKIE_MODE=.*/AUTH_COOKIE_MODE=true/' .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
          docker compose --env-file .env up --build -d
      - name: Wait for health (cookie mode)
        run: |
          for i in {1..40}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run cookie-mode smoke suite
        run: |
          python -m pip install httpx
          python scripts/smoke_mvp.py --base-url http://localhost:8000/api/v1 --auth-mode cookie
      - name: Run cookie-mode auth integration test
        run: |
          python -m pip install ./backend[dev]
          cd backend
          RUN_INTEGRATION_LIVE=1 AUTH_COOKIE_MODE=true INTEGRATION_BASE_URL=http://localhost:8000/api/v1 pytest app/tests/test_auth_cookie_integration_live.py -q
      - name: Run Playwright E2E (cookie mode)
        run: |
          cd frontend
          E2E_BASE_URL=http://localhost:3000 E2E_API_URL=http://localhost:8000/api/v1 E2E_AUTH_MODE=cookie npm run e2e
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v

  plaid-epic-a:
    if: ${{ vars.CI_E2E_PLAID_LANE == '1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_plaid_lane == 'true') }}
    runs-on: ubuntu-latest
    env:
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_ENV: sandbox
      PLAID_PRODUCTS: transactions
      PLAID_COUNTRY_CODES: US
      PLAID_WEBHOOK_SECRET: ${{ secrets.PLAID_WEBHOOK_SECRET }}
      PLAID_TEST_INSTITUTION_ID: ins_109508
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Plaid secrets
        run: |
          test -n "${PLAID_CLIENT_ID}" || { echo "::error::Missing PLAID_CLIENT_ID secret"; exit 1; }
          test -n "${PLAID_SECRET}" || { echo "::error::Missing PLAID_SECRET secret"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare Plaid integration env
        run: |
          cp .env.example .env
          {
            echo "BANK_PROVIDER=plaid"
            echo "PLAID_CLIENT_ID=${PLAID_CLIENT_ID}"
            echo "PLAID_SECRET=${PLAID_SECRET}"
            echo "PLAID_ENV=${PLAID_ENV}"
            echo "PLAID_PRODUCTS=${PLAID_PRODUCTS}"
            echo "PLAID_COUNTRY_CODES=${PLAID_COUNTRY_CODES}"
            echo "PLAID_WEBHOOK_SECRET=${PLAID_WEBHOOK_SECRET:-plaid-ci-webhook-secret}"
            echo "PLAID_WEBHOOK_URL=https://example.com/plaid-ci-webhook"
            echo "AUTH_COOKIE_MODE=false"
            echo "COOKIE_SECURE=false"
          } >> .env
      - name: Start stack
        run: docker compose --env-file .env up --build -d
      - name: Wait for health
        run: |
          for i in {1..50}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run Plaid live backend test (container runtime)
        run: |
          docker compose --env-file .env exec -T backend sh -lc \
            "RUN_INTEGRATION_LIVE=1 PLAID_SANDBOX_E2E=1 INTEGRATION_BASE_URL=http://localhost:8000/api/v1 pytest app/tests/test_plaid_sandbox_live.py -q"
      - name: Install frontend deps + Playwright browser
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate Plaid sandbox public token for Playwright
        run: |
          python -m pip install --upgrade pip httpx
          python - <<'PY'
          import os
          import httpx

          payload = {
              "client_id": os.environ["PLAID_CLIENT_ID"],
              "secret": os.environ["PLAID_SECRET"],
              "institution_id": os.getenv("PLAID_TEST_INSTITUTION_ID", "ins_109508"),
              "initial_products": ["transactions"],
              "options": {"webhook": "https://example.com/plaid-ci-webhook"},
          }
          with httpx.Client(timeout=30.0) as client:
              response = client.post("https://sandbox.plaid.com/sandbox/public_token/create", json=payload)
              response.raise_for_status()
              token = response.json().get("public_token")
          if not token:
              raise SystemExit("Missing public_token from Plaid sandbox response")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"E2E_PLAID_PUBLIC_TOKEN={token}\n")
          PY
      - name: Run Playwright Plaid E2E spec
        run: |
          cd frontend
          E2E_BASE_URL=http://localhost:3000 \
          E2E_API_URL=http://localhost:8000/api/v1 \
          E2E_AUTH_MODE=bearer \
          E2E_PLAID_SANDBOX=1 \
          npx playwright test e2e/plaid-integration.spec.ts
      - name: Upload Plaid Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plaid-playwright-report
          path: frontend/playwright-report
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v

  ai-live-mode:
    if: ${{ vars.CI_AI_LIVE_MODE_LANE == '1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ai_live_lane == 'true') }}
    runs-on: ubuntu-latest
    env:
      AI_OPENAI_API_KEY: ${{ secrets.AI_OPENAI_API_KEY }}
      AI_OPENAI_MODEL: ${{ vars.AI_OPENAI_MODEL != '' && vars.AI_OPENAI_MODEL || 'gpt-4o-mini' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenAI secret
        run: |
          test -n "${AI_OPENAI_API_KEY}" || { echo "::error::Missing AI_OPENAI_API_KEY secret"; exit 1; }
      - name: Prepare AI live-mode env
        run: |
          cp .env.example .env
          {
            echo "AI_PROVIDER=openai"
            echo "AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY}"
            echo "AI_OPENAI_MODEL=${AI_OPENAI_MODEL}"
            echo "AUTH_COOKIE_MODE=false"
            echo "COOKIE_SECURE=false"
          } >> .env
      - name: Start stack
        run: docker compose --env-file .env up --build -d postgres redis minio backend
      - name: Wait for health
        run: |
          for i in {1..50}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          docker compose logs backend --tail 200
          exit 1
      - name: Install script dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx asyncpg
      - name: Verify AI live mode + fallback guard
        run: |
          python scripts/ops/verify_ai_live_mode.py \
            --api-base-url http://localhost:8000/api/v1 \
            --database-url postgresql://ai_coo:ai_coo@localhost:5432/ai_coo \
            --live-check \
            --verify-fallback-test \
            --fallback-test-path backend/app/tests/test_ai_service.py::test_ai_service_falls_back_on_provider_error \
            --out-json ai-live-mode-report.json
      - name: Upload AI live-mode report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-mode-report
          path: ai-live-mode-report.json
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v

  stripe-epic-b:
    if: ${{ vars.STRIPE_SECRET_KEY != '' && vars.STRIPE_WEBHOOK_SECRET != '' }}
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare Stripe integration env
        run: |
          cp .env.example .env
          {
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
            echo "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}"
            echo "AUTH_COOKIE_MODE=false"
            echo "COOKIE_SECURE=false"
          } >> .env
      - name: Start stack
        run: docker compose --env-file .env up --build -d
      - name: Wait for health
        run: |
          for i in {1..50}; do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run Stripe live backend test (container runtime)
        run: |
          docker compose --env-file .env exec -T backend sh -lc \
            "RUN_INTEGRATION_LIVE=1 STRIPE_SANDBOX_E2E=1 INTEGRATION_BASE_URL=http://localhost:8000/api/v1 pytest app/tests/test_stripe_sandbox_live.py -q"
      - name: Install frontend deps + Playwright browser
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright Stripe E2E spec
        run: |
          cd frontend
          E2E_BASE_URL=http://localhost:3000 \
          E2E_API_URL=http://localhost:8000/api/v1 \
          E2E_AUTH_MODE=bearer \
          E2E_STRIPE_LIVE=1 \
          E2E_STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY} \
          E2E_STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET} \
          npx playwright test e2e/stripe-integration.spec.ts
      - name: Upload Stripe Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-playwright-report
          path: frontend/playwright-report
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v
